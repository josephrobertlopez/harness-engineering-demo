name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No install, no secrets: the package is stdlib-only and the mock
      # backend runs the whole loop offline. The suite fails loudly if
      # anything opens a socket.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
