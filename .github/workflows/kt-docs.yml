name: kt-docs

on:
  pull_request:

permissions:
  contents: read

jobs:
  kt-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an added or changed file under docs/kt/
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${ACT:-}" = "true" ] && jq -e 'has("act_changed_files")' "$GITHUB_EVENT_PATH" >/dev/null; then
            # act fallback: no real base ref, read the changed files from the event payload
            files="$(jq -r '.act_changed_files[]' "$GITHUB_EVENT_PATH")"
          else
            git fetch --no-tags origin "$BASE_REF"
            files="$(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD")"
          fi
          echo "added/changed files:"; echo "$files"
          if grep -Eq '^docs/kt/' <<<"$files"; then
            echo "kt-docs: OK"
          else
            echo "kt-docs: FAIL - PR must add or change a file under docs/kt/" >&2
            exit 1
          fi
