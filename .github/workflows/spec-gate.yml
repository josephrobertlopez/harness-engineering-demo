name: spec-gate

on:
  pull_request:

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN_SECRET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install specgate
        run: pip install -e "plugins/specgate[dev]"
      - name: L0-L5 on every change with a prd.md
        shell: bash
        run: |
          set -euo pipefail
          for prd in openspec/changes/*/prd.md; do
            [ -e "$prd" ] || { echo "no changes with prd.md"; exit 0; }
            change="$(basename "$(dirname "$prd")")"
            echo "== $change L0-L5"
            specgate check --change "$change" --layers L0-L5
          done
      - name: L6 replay of committed debate.cache.json
        shell: bash
        run: |
          set -euo pipefail
          # Only export the token if it is non-empty: a cache miss without it is a FAIL.
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN_SECRET:-}" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN_SECRET"
          fi
          for prd in openspec/changes/*/prd.md; do
            [ -e "$prd" ] || exit 0
            change="$(basename "$(dirname "$prd")")"
            echo "== $change L6"
            specgate check --change "$change" --layers L6
          done
      - name: trace.json must be byte-identical after regeneration
        shell: bash
        run: |
          set -euo pipefail
          for prd in openspec/changes/*/prd.md; do
            [ -e "$prd" ] || exit 0
            change="$(basename "$(dirname "$prd")")"
            specgate check --change "$change" --layers L0-L5
            test -f "openspec/changes/$change/trace.json" || { echo "missing trace.json for $change" >&2; exit 1; }
          done
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard -- 'openspec/changes/*/trace.json')"
          if [ -n "$untracked" ]; then echo "untracked trace.json: $untracked" >&2; exit 1; fi
